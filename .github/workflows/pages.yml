name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          # GitHub の Settings → Secrets and variables → Actions → Variables で設定する。未設定なら広告は出ない。
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
          NEXT_PUBLIC_ADSENSE_SIDE_SLOT: ${{ vars.ADSENSE_SIDE_SLOT }}
          # YouTube タブでチャンネルの動画一覧を読むキー。Google Cloud 側で HTTP リファラーを公開ドメインに、API を YouTube Data API v3 に制限しておく。
          # Variables と Secrets のどちらに入れても使う。未設定なら、チャンネルの動画一覧は読み込めない（動画・ページの検索は使える）。
          # （公開ページの JS に入るので秘密にはならない。守りは Google Cloud 側のリファラー制限）
          NEXT_PUBLIC_YOUTUBE_API_KEY: ${{ vars.YOUTUBE_API_KEY || secrets.YOUTUBE_API_KEY }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
